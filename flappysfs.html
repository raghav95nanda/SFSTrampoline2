<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Balloon Flappy Game</title>
  <style>
    :root {
      --game-max-width: 900px;
      --player-size: 40px; /* visual size; JS also uses 40px below */
    }

    body {
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
    }

    #game-container {
      position: relative;
      width: min(100%, var(--game-max-width));
      aspect-ratio: 2906 / 632; /* same as stage.svg */
      background: transparent;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    #stage-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Character */
    #player {
      position: absolute;
      width: var(--player-size);
      height: var(--player-size);
      transform: translate(-50%, -50%);
      left: 18%;
      top: 50%;
      pointer-events: none;
    }

    #player-lottie > div {
      width: 100%;
      height: 100%;
    }

    /* Start overlay */
    #start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.35);
      z-index: 5;
    }

    #start-button {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    #start-button img {
      width: 180px;
      height: auto;
      display: block;
    }

    #start-text {
      margin-top: 12px;
      color: #fff;
      font-size: 14px;
    }

    /* Game over / win overlay */
    #result-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.45);
      z-index: 6;
      text-align: center;
    }

    #result-message {
      color: #fff;
      font-size: 28px;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    #replay-button {
      margin-top: 4px;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      background: #f48120;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }

    .hitbox {
      position: absolute;
      pointer-events: none;
    }

    .hitbox.debug-spike {
      background: rgba(255, 0, 0, 0.25);
      outline: 1px solid rgba(255, 0, 0, 0.7);
    }

    .hitbox.debug-goal {
      background: rgba(0, 255, 0, 0.2);
      outline: 1px solid rgba(0, 255, 0, 0.7);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <img id="stage-bg" src="stage.svg" alt="Stage" />

    <div id="player">
      <div id="player-lottie"></div>
    </div>

    <!-- Start overlay -->
    <div id="start-overlay">
      <button id="start-button" type="button">
        <img src="Start.svg" alt="Start" />
      </button>
      <div id="start-text">Tap START to play. Click inside to jump.</div>
    </div>

    <!-- Result overlay -->
    <div id="result-overlay">
      <div id="result-message"></div>
      <button id="replay-button" type="button">Replay</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    window.addEventListener('load', () => {
      // ----- CONFIG ------------------------------------------------------

      // A few bottom spike hitboxes aligned to one cluster (easier game)
      const SPIKE_DEFS = [
        { x: 0.188, y: 0.74, width: 0.024, height: 0.28 },
        { x: 0.218, y: 0.74, width: 0.024, height: 0.28 },
        { x: 0.248, y: 0.74, width: 0.024, height: 0.28 }
      ];

      // Finish/checkered strip on the right of the SVG
      const GOAL_DEF = { x: 0.955, y: 0.10, width: 0.045, height: 0.80 };

      const SHOW_DEBUG_HITBOXES = true; // toggle if you want to see hitboxes

      // Physics (easy-ish)
      const HORIZONTAL_SPEED = 80;
      const GRAVITY = 550;
      const FLAP_VELOCITY = -250;
      const MAX_FALL_SPEED = 480;

      const PLAYER_SIZE = 40; // keep in sync with --player-size

      // ----- DOM ---------------------------------------------------------

      const gameEl = document.getElementById('game-container');
      const playerEl = document.getElementById('player');
      const startOverlay = document.getElementById('start-overlay');
      const startButton = document.getElementById('start-button');
      const resultOverlay = document.getElementById('result-overlay');
      const resultMessage = document.getElementById('result-message');
      const replayButton = document.getElementById('replay-button');

      // Lottie
      const jumpAnim = lottie.loadAnimation({
        container: document.getElementById('player-lottie'),
        renderer: 'svg',
        loop: false,
        autoplay: false,
        path: 'jump.json'
      });

      let jumpLastFrame = null;
      jumpAnim.addEventListener('DOMLoaded', () => {
        jumpLastFrame = jumpAnim.totalFrames - 1;
        jumpAnim.goToAndStop(0, true);
      });

      // ----- STATE -------------------------------------------------------

      let state = 'ready'; // 'ready' | 'running' | 'dead' | 'won'

      let playerX = 0;
      let playerY = 0;
      let velY = 0;

      let spikes = [];
      let goal = null;

      let lastTimestamp = null;
      let rafId = null;

      // ----- HITBOXES ----------------------------------------------------

      function createHitboxes() {
        spikes.forEach(s => s.el.remove());
        spikes = [];
        if (goal && goal.el) goal.el.remove();
        goal = null;

        const gw = gameEl.clientWidth;
        const gh = gameEl.clientHeight;

        SPIKE_DEFS.forEach(def => {
          const el = document.createElement('div');
          el.className = 'hitbox' + (SHOW_DEBUG_HITBOXES ? ' debug-spike' : '');
          gameEl.appendChild(el);

          const x = def.x * gw;
          const y = def.y * gh;
          const w = def.width * gw;
          const h = def.height * gh;

          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.width = w + 'px';
          el.style.height = h + 'px';

          spikes.push({ x, y, w, h, el });
        });

        const gEl = document.createElement('div');
        gEl.className = 'hitbox' + (SHOW_DEBUG_HITBOXES ? ' debug-goal' : '');
        gameEl.appendChild(gEl);

        const gx = GOAL_DEF.x * gw;
        const gy = GOAL_DEF.y * gh;
        const gwid = GOAL_DEF.width * gw;
        const ghgt = GOAL_DEF.height * gh;

        gEl.style.left = gx + 'px';
        gEl.style.top = gy + 'px';
        gEl.style.width = gwid + 'px';
        gEl.style.height = ghgt + 'px';

        goal = { x: gx, y: gy, w: gwid, h: ghgt, el: gEl };
      }

      window.addEventListener('resize', () => {
        createHitboxes();
        resetPlayerPosition();
      });

      // ----- PLAYER / ANIMATION -----------------------------------------

      function resetPlayerPosition() {
        const gw = gameEl.clientWidth;
        const gh = gameEl.clientHeight;
        playerX = gw * 0.18;
        playerY = gh * 0.5;
        velY = 0;
        updatePlayerEl();
      }

      function updatePlayerEl() {
        playerEl.style.left = playerX + 'px';
        playerEl.style.top = playerY + 'px';
      }

      function flap() {
        if (state !== 'running') return;

        velY = FLAP_VELOCITY;

        if (jumpLastFrame !== null) {
          jumpAnim.setDirection(-1);
          jumpAnim.setSpeed(0.6);
          jumpAnim.goToAndStop(jumpLastFrame, true);
          jumpAnim.play();
        }
      }

      // ----- COLLISION ---------------------------------------------------

      function rectsOverlap(a, b) {
        return !(
          a.x + a.w < b.x ||
          a.x > b.x + b.w ||
          a.y + a.h < b.y ||
          a.y > b.y + b.h
        );
      }

      function getPlayerRect() {
        return {
          x: playerX - PLAYER_SIZE / 2,
          y: playerY - PLAYER_SIZE / 2,
          w: PLAYER_SIZE,
          h: PLAYER_SIZE
        };
      }

      function checkCollisions() {
  const gh = gameEl.clientHeight;
  const playerRect = getPlayerRect();

  // Hit spikes?
  for (const s of spikes) {
    if (rectsOverlap(playerRect, s)) {
      endGame(false);
      return;
    }
  }

  // FLOOR: hitting the bottom is game over
  if (playerRect.y + playerRect.h >= gh) {
    endGame(false);
    return;
  }

  // ROOF: just clamp to top, don't end the game
  if (playerRect.y <= 0) {
    // keep the character inside the screen
    playerY = PLAYER_SIZE / 2;
    velY = 0;               // stop upward velocity so it "slides" along the roof
    updatePlayerEl();
  }

  // Reached goal?
  if (goal && rectsOverlap(playerRect, goal)) {
    endGame(true);
  }
}


      // ----- GAME LOOP ---------------------------------------------------

      function gameLoop(timestamp) {
        if (lastTimestamp == null) lastTimestamp = timestamp;
        const dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (state === 'running') {
          const gw = gameEl.clientWidth;

          playerX += HORIZONTAL_SPEED * dt;

          velY += GRAVITY * dt;
          if (velY > MAX_FALL_SPEED) velY = MAX_FALL_SPEED;
          playerY += velY * dt;

          const minX = PLAYER_SIZE / 2;
          const maxX = gw - PLAYER_SIZE / 2;
          if (playerX > maxX) playerX = maxX;
          if (playerX < minX) playerX = minX;

          updatePlayerEl();
          checkCollisions();
        }

        rafId = requestAnimationFrame(gameLoop);
      }

      // ----- START / END / REPLAY ---------------------------------------

      function startGame() {
        state = 'running';
        resultOverlay.style.display = 'none';
        startOverlay.style.display = 'none';
        resetPlayerPosition();
        lastTimestamp = null;
      }

      function endGame(won) {
        if (state !== 'running') return;
        state = won ? 'won' : 'dead';
        resultMessage.textContent = won ? 'You Win! 🎉' : 'Game Over!';
        resultOverlay.style.display = 'flex';
      }

      function resetGameAndShowStart() {
        state = 'ready';
        resetPlayerPosition();
        resultOverlay.style.display = 'none';
        startOverlay.style.display = 'flex';
        if (jumpLastFrame !== null) {
          jumpAnim.goToAndStop(0, true);
        }
      }

      // ----- EVENTS ------------------------------------------------------

      startButton.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
      });

      replayButton.addEventListener('click', (e) => {
        e.stopPropagation();
        resetGameAndShowStart();
      });

      gameEl.addEventListener('click', () => {
        if (state === 'running') flap();
      });

      // ----- INIT --------------------------------------------------------

      createHitboxes();
      resetPlayerPosition();
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
