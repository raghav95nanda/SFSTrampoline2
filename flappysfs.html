<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Balloon Flappy Game</title>

  <style>
    :root {
      --game-max-width: 900px;

      /* Character size knobs */
      --player-size-desktop: 40px;
      --player-size-mobile: 18px;
      --player-size: var(--player-size-desktop);
    }

    @media (max-width: 768px) {
      :root {
        --player-size: var(--player-size-mobile);
      }
    }

    body {
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
    }

    #game-container {
      position: relative;
      width: min(100%, var(--game-max-width));
      aspect-ratio: 2906 / 632; /* 🔒 keep SVG aspect */
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stage-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    #player {
      position: absolute;
      width: var(--player-size);
      height: var(--player-size);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #player-lottie > div { width:100%; height:100%; }

    #start-overlay,
    #result-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      z-index: 5;
    }

    #result-overlay { display:none; }

    #start-button {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    #start-button img { width:min(140px,30vw); }

    #start-text { color:#fff; margin-top:10px; }

    #result-message {
      color:#fff;
      font-size:28px;
      margin-bottom:10px;
    }

    #replay-button {
      border:none;
      padding:8px 18px;
      border-radius:999px;
      background:#f48120;
      color:#fff;
      font-weight:600;
      cursor:pointer;
    }

    .hitbox{position:absolute;pointer-events:none;}
    .debug-spike{background:rgba(255,0,0,.25);outline:1px solid red;}
    .debug-goal{background:rgba(0,255,0,.25);outline:1px solid green;}
  </style>
</head>

<body>
  <div id="game-container">
    <img id="stage-bg" src="stage.svg"/>

    <div id="player">
      <div id="player-lottie"></div>
    </div>

    <div id="start-overlay">
      <button id="start-button"><img src="Start.svg"></button>
      <div id="start-text">Tap START to play. Tap the stage to jump.</div>
    </div>

    <div id="result-overlay">
      <div id="result-message"></div>
      <button id="replay-button">Replay</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    window.addEventListener('load', () => {

      /* ---------------- CONFIG ---------------- */

      // Spike rects (relative to SVG)
      const SPIKE_DEFS = [
        { x:0.1170,y:-0.1995,width:0.0211,height:0.5860 },
        { x:0.1413,y:-0.1995,width:0.0211,height:0.5860 },
        { x:0.1639,y:-0.1995,width:0.0211,height:0.5860 },

        { x:0.1834,y:0.7545,width:0.0211,height:0.2518 },
        { x:0.2077,y:0.7545,width:0.0211,height:0.2518 },
        { x:0.2303,y:0.7545,width:0.0211,height:0.2518 },

        { x:0.4001,y:-0.0082,width:0.0211,height:0.2518 },
        { x:0.4243,y:-0.0082,width:0.0211,height:0.2518 },
        { x:0.4470,y:-0.0082,width:0.0211,height:0.2518 },

        { x:0.5461,y:0.5801,width:0.0211,height:0.5860 },
        { x:0.5704,y:0.5801,width:0.0211,height:0.5860 },
        { x:0.5930,y:0.5801,width:0.0211,height:0.5860 },

        { x:0.7401,y:0.4203,width:0.0211,height:0.5860 },
        { x:0.8497,y:-0.0639,width:0.0211,height:0.5860 }
      ];

      const GOAL_DEF = { x:0.955,y:0.10,width:0.045,height:0.80 };

      const SHOW_DEBUG = false;

      /* --- YOUR UPDATED HITBOX TUNING --- */
      const SHRINK_X = 0.002;
      const SHRINK_Y = 0.005;

      const HITBOX_SHRINK_X = 0.006;
      const HITBOX_SHRINK_Y = 0.04;

      /* --- YOUR UPDATED PHYSICS --- */
      const HORIZONTAL_SPEED = 80;
      const GRAVITY = 350;
      const FLAP_VELOCITY = -120;
      const MAX_FALL_SPEED = 480;

      /* ---------------------------------- */

      const gameEl = document.getElementById('game-container');
      const playerEl = document.getElementById('player');
      const startOverlay = document.getElementById('start-overlay');
      const resultOverlay = document.getElementById('result-overlay');
      const resultMessage = document.getElementById('result-message');
      const startButton = document.getElementById('start-button');
      const replayButton = document.getElementById('replay-button');

      let PLAYER_SIZE = 40;
      function updatePlayerSize(){
        PLAYER_SIZE=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--player-size'))||40;
      }
      updatePlayerSize();

      const jumpAnim = lottie.loadAnimation({
        container: document.getElementById('player-lottie'),
        renderer:'svg',loop:false,autoplay:false,path:'jump.json'
      });

      let jumpLastFrame=null;
      jumpAnim.addEventListener('DOMLoaded',()=>{
        jumpLastFrame=jumpAnim.totalFrames-1;
        jumpAnim.goToAndStop(0,true);
      });

      function addTap(el,fn){
        let t=false;
        el.addEventListener('touchstart',e=>{t=true;e.preventDefault();fn(e)}, {passive:false});
        el.addEventListener('click',e=>{if(t){t=false;return}fn(e)});
      }

      let state='ready';
      let playerX=0,playerY=0,velY=0;
      let spikes=[],goal=null;
      let invincibleUntil=0;
      let lastT=null;

      function createHitboxes(){
        spikes.forEach(s=>s.el.remove());
        spikes=[];

        if(goal?.el)goal.el.remove();
        goal=null;

        const gw=gameEl.clientWidth, gh=gameEl.clientHeight;

        SPIKE_DEFS.forEach(d=>{
          const el=document.createElement('div');
          el.className='hitbox'+(SHOW_DEBUG?' debug-spike':'');
          gameEl.appendChild(el);

          const rawX=d.x*gw, rawY=d.y*gh, rawW=d.width*gw, rawH=d.height*gh;

          const x=rawX+HITBOX_SHRINK_X*gw;
          const y=rawY+HITBOX_SHRINK_Y*gh;
          const w=Math.max(0,rawW-2*HITBOX_SHRINK_X*gw);
          const h=Math.max(0,rawH-2*HITBOX_SHRINK_Y*gh);

          el.style.left=x+'px';
          el.style.top=y+'px';
          el.style.width=w+'px';
          el.style.height=h+'px';

          spikes.push({x,y,w,h,el});
        });

        const gEl=document.createElement('div');
        gEl.className='hitbox'+(SHOW_DEBUG?' debug-goal':'');
        gameEl.appendChild(gEl);

        const gx=GOAL_DEF.x*gw, gy=GOAL_DEF.y*gh, gwid=GOAL_DEF.width*gw, ghgt=GOAL_DEF.height*gh;

        gEl.style.left=gx+'px';
        gEl.style.top=gy+'px';
        gEl.style.width=gwid+'px';
        gEl.style.height=ghgt+'px';

        goal={x:gx,y:gy,w:gwid,h:ghgt,el:gEl};
      }

      function resetPlayer(){
        const gw=gameEl.clientWidth, gh=gameEl.clientHeight;
        playerX=gw*0.10;
        playerY=gh*0.5;
        velY=0;
        playerEl.style.left=playerX+'px';
        playerEl.style.top=playerY+'px';
      }

      function flap(){
        if(state!=='running')return;
        velY=FLAP_VELOCITY;
        if(jumpLastFrame!=null){
          jumpAnim.setDirection(-1);
          jumpAnim.setSpeed(0.6);
          jumpAnim.goToAndStop(jumpLastFrame,true);
          jumpAnim.play();
        }
      }

      function getPlayerRect(){
        return{
          x:playerX-PLAYER_SIZE/2,
          y:playerY-PLAYER_SIZE/2,
          w:PLAYER_SIZE,
          h:PLAYER_SIZE
        };
      }

      function overlaps(a,b){
        return !(a.x+a.w<b.x||a.x>b.x+b.w||a.y+a.h<b.y||a.y>b.y+b.h);
      }

      function checkCollisions(){
        if(performance.now()<invincibleUntil)return;

        const gh=gameEl.clientHeight;
        const r=getPlayerRect();

        for(const s of spikes)if(overlaps(r,s))return end(false);

        if(r.y+r.h>=gh)return end(false);

        if(r.y<=0){playerY=PLAYER_SIZE/2;velY=0;}

        if(goal&&overlaps(r,goal))end(true);
      }

      function loop(t){
        if(lastT==null)lastT=t;
        const dt=(t-lastT)/1000;
        lastT=t;

        if(state==='running'){
          const gw=gameEl.clientWidth;

          playerX+=HORIZONTAL_SPEED*dt;
          velY+=GRAVITY*dt;
          if(velY>MAX_FALL_SPEED)velY=MAX_FALL_SPEED;
          playerY+=velY*dt;

          const minX=PLAYER_SIZE/2, maxX=gw-PLAYER_SIZE/2;
          if(playerX<minX)playerX=minX;
          if(playerX>maxX)playerX=maxX;

          playerEl.style.left=playerX+'px';
          playerEl.style.top=playerY+'px';

          checkCollisions();
        }

        requestAnimationFrame(loop);
      }

      function start(){
        state='running';
        resultOverlay.style.display='none';
        startOverlay.style.display='none';
        resetPlayer();
        lastT=null;
        invincibleUntil=performance.now()+600;
      }

      function end(won){
        if(state!=='running')return;
        state=won?'won':'dead';
        resultMessage.textContent=won?'You Win! 🎉':'Game Over!';
        resultOverlay.style.display='flex';
      }

      function reset(){
        state='ready';
        resetPlayer();
        resultOverlay.style.display='none';
        startOverlay.style.display='flex';
        if(jumpLastFrame!=null)jumpAnim.goToAndStop(0,true);
      }

      /* EVENTS */
      addTap(startButton,start);
      addTap(replayButton,reset);
      addTap(gameEl,()=>state==='running'&&flap());

      window.addEventListener('resize',()=>{
        updatePlayerSize();
        createHitboxes();
        resetPlayer();
      });

      /* INIT */
      updatePlayerSize();
      createHitboxes();
      resetPlayer();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
