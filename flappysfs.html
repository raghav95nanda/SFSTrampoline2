<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Balloon Flappy Game</title>
  <style>
    :root {
      --game-max-width: 900px;

      /* 🔧 Character size (single knob for CSS + JS) */
      --player-size: 40px;
    }

    body {
      background: #ffffff; /* white page */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
    }

    #game-container {
      position: relative;
      width: min(100%, var(--game-max-width));
      /* same aspect ratio as stage.svg (2906 x 632) */
      aspect-ratio: 2906 / 632;
      background: transparent;              /* transparent box */
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    #stage-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Character */
    #player {
      position: absolute;
      width: var(--player-size);
      height: var(--player-size);
      transform: translate(-50%, -50%);
      left: 18%;
      top: 50%;
      pointer-events: none;
    }

    #player-lottie > div {
      width: 100%;
      height: 100%;
    }

    /* Start overlay */
    #start-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.35);
      z-index: 5;
    }

    #start-button {
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    #start-button img {
      width: 180px;
      height: auto;
      display: block;
    }

    #start-text {
      margin-top: 12px;
      color: #fff;
      font-size: 14px;
    }

    /* Game over / win overlay */
    #result-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.45);
      z-index: 6;
      text-align: center;
    }

    #result-message {
      color: #fff;
      font-size: 28px;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    #replay-button {
      margin-top: 4px;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      background: #f48120;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }

    /* Invisible hitboxes for spikes & finish */
    .hitbox {
      position: absolute;
      pointer-events: none;
    }

    /* Set SHOW_DEBUG_HITBOXES = true in JS to see these */
    .hitbox.debug-spike {
      background: rgba(255, 0, 0, 0.25);
      outline: 1px solid rgba(255, 0, 0, 0.7);
    }

    .hitbox.debug-goal {
      background: rgba(0, 255, 0, 0.2);
      outline: 1px solid rgba(0, 255, 0, 0.7);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <img id="stage-bg" src="stage.svg" alt="Stage" />

    <div id="player">
      <div id="player-lottie"></div>
    </div>

    <!-- Start overlay -->
    <div id="start-overlay">
      <button id="start-button" type="button">
        <img src="Start.svg" alt="Start" />
      </button>
      <div id="start-text">Tap START to play. Click inside to jump.</div>
    </div>

    <!-- Result overlay -->
    <div id="result-overlay">
      <div id="result-message"></div>
      <button id="replay-button" type="button">Replay</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
