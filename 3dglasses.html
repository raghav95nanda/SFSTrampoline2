<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Glasses Mascot Reveal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;  /* white background */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .ui {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      color: #222;
    }
    .ui .title {
      font-size: 0.95rem;
      opacity: 0.9;
    }
    .ui .hint {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 4px;
    }

    /* 2D mascot, ~100px tall, centered */
    #scene {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 100px;   /* controls mascot height */
      user-select: none;
      pointer-events: none;
    }
    #mascot2D {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Draggable glasses container */
    #glassesContainer {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: min(260px, 80vw);
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      z-index: 10;
    }
    #glassesContainer.dragging {
      cursor: grabbing;
    }

    #glasses {
      width: 100%;
      display: block;
      pointer-events: none;
      position: relative;
      z-index: 3;
    }

    /* Lenses: only these show the 3D mascot.
       Positions are derived from the transparent eye-holes of 1536x386px glasses PNG. */
    .lens {
      position: absolute;
      overflow: hidden;
      pointer-events: none;
      background-image: url("3D%20Mascot.png");
      background-repeat: no-repeat;
      background-size: cover;  /* will be set to mascot size via JS */
      z-index: 1;
      background-color: white; /* when not over mascot, show white */
      visibility: hidden;      /* only visible when overlapping mascot */
    }

    /* Left eye-hole */
    .lens.left {
      left: 28.32%;
      top: 12.7%;
      width: 15.82%;
      height: 39.64%;
    }

    /* Right eye-hole */
    .lens.right {
      left: 55.79%;
      top: 12.7%;
      width: 15.82%;
      height: 39.64%;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="title">Drag the 3D glasses around</div>
    <div class="hint">When the lenses pass over the mascot, it pops into 3D.</div>
  </div>

  <!-- Centered 2D mascot -->
  <div id="scene">
    <img id="mascot2D" src="2D-Mascot.png" alt="2D Mascot" />
  </div>

  <!-- Draggable glasses + lens windows -->
  <div id="glassesContainer">
    <div class="lens left"></div>
    <div class="lens right"></div>
    <img id="glasses" src="3DGlasses.png" alt="3D Glasses" />
  </div>

  <script>
    (function () {
      const scene = document.getElementById("scene");
      const glassesContainer = document.getElementById("glassesContainer");
      const mascot2D = document.getElementById("mascot2D");
      const lenses = Array.from(document.querySelectorAll(".lens"));

      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;

      function updateLensBackgroundSize() {
        const rect = scene.getBoundingClientRect();
        lenses.forEach(lens => {
          lens.style.backgroundSize = rect.width + "px " + rect.height + "px";
        });
      }

      function updateLensBackgroundPositionAndVisibility() {
        const sceneRect = scene.getBoundingClientRect();

        lenses.forEach(lens => {
          const lensRect = lens.getBoundingClientRect();

          // Check if this lens actually overlaps the mascot
          const interLeft = Math.max(lensRect.left, sceneRect.left);
          const interRight = Math.min(lensRect.right, sceneRect.right);
          const interTop = Math.max(lensRect.top, sceneRect.top);
          const interBottom = Math.min(lensRect.bottom, sceneRect.bottom);

          if (interLeft >= interRight || interTop >= interBottom) {
            // No overlap -> nothing visible in this lens
            lens.style.visibility = "hidden";
            return;
          }

          lens.style.visibility = "visible";

          // Correct background-position so 3D lines up with 2D mascot
          const offsetX = sceneRect.left - lensRect.left;
          const offsetY = sceneRect.top - lensRect.top;
          lens.style.backgroundPosition = offsetX + "px " + offsetY + "px";
        });
      }

      function updateLenses() {
        updateLensBackgroundSize();
        updateLensBackgroundPositionAndVisibility();
      }

      mascot2D.addEventListener("load", updateLenses);
      window.addEventListener("resize", updateLenses);

      // Dragging logic
      glassesContainer.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        isDragging = true;
        glassesContainer.classList.add("dragging");

        const rect = glassesContainer.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        // Remove initial centering transform so left/top work directly
        glassesContainer.style.transform = "none";
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;

        let left = e.clientX - offsetX;
        let top  = e.clientY - offsetY;

        // Keep glasses roughly on-screen
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const rect = glassesContainer.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;

        left = Math.max(-w * 0.3, Math.min(left, vw - w * 0.7));
        top  = Math.max(-h * 0.3, Math.min(top, vh - h * 0.7));

        glassesContainer.style.left = left + "px";
        glassesContainer.style.top  = top + "px";

        updateLensBackgroundPositionAndVisibility();
      });

      function stopDrag() {
        if (!isDragging) return;
        isDragging = false;
        glassesContainer.classList.remove("dragging");
      }

      window.addEventListener("pointerup", stopDrag);
      window.addEventListener("pointercancel", stopDrag);
      window.addEventListener("pointerleave", stopDrag);

      // If mascot image is already cached
      if (mascot2D.complete) {
        updateLenses();
      }
    })();
  </script>
</body>
</html>
