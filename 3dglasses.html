<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Glasses Reveal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
      overflow: hidden;
    }

    .wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none; /* so drag passes through except on the glasses */
    }

    .title {
      font-size: 1rem;
      margin-bottom: 0.75rem;
      opacity: 0.85;
    }

    #scene {
      position: relative;
      width: min(260px, 70vw);   /* keep it small / “tiny” */
      user-select: none;
      pointer-events: none;
    }

    #mascot2D {
      width: 100%;
      display: block;
    }

    .hint {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    /* Draggable 3D glasses window */

    #glassesContainer {
      position: fixed;         /* can be dragged anywhere on the screen */
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: min(200px, 75vw); /* small glasses */
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      overflow: hidden;        /* acts as a clipping window */
      z-index: 10;

      background-image: url("3D%20Mascot.png");
      background-repeat: no-repeat;
      background-position: 0 0; /* updated in JS to match scene position */
      background-size: cover;   /* will be overridden in JS to match scene size */
    }

    #glassesContainer.dragging {
      cursor: grabbing;
    }

    #glasses {
      width: 100%;
      display: block;
      pointer-events: none;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="title">Drag the 3D glasses over the mascot</div>

    <div id="scene">
      <!-- 2D mascot base -->
      <img id="mascot2D" src="2D-Mascot.png" alt="2D Mascot" />
    </div>

    <div class="hint">Where the glasses pass over the mascot, it pops into 3D.</div>
  </div>

  <!-- Draggable glasses window that reveals the 3D mascot -->
  <div id="glassesContainer">
    <img id="glasses" src="3DGlasses.png" alt="3D Glasses" />
  </div>

  <script>
    (function () {
      const scene = document.getElementById("scene");
      const glassesContainer = document.getElementById("glassesContainer");
      const mascot2D = document.getElementById("mascot2D");

      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;

      // Ensure the 3D mascot background scales exactly like the 2D mascot
      function updateBackgroundSize() {
        const rect = scene.getBoundingClientRect();
        // Background should be the same size as the mascot area
        glassesContainer.style.backgroundSize = rect.width + "px " + rect.height + "px";
      }

      function updateBackgroundPosition() {
        const sceneRect = scene.getBoundingClientRect();
        const glassesRect = glassesContainer.getBoundingClientRect();

        // Offset of the glasses relative to the scene
        const relLeft = glassesRect.left - sceneRect.left;
        const relTop = glassesRect.top - sceneRect.top;

        // Move background so what shows through is the correct part of the 3D mascot
        glassesContainer.style.backgroundPosition = `-${relLeft}px -${relTop}px`;
      }

      mascot2D.addEventListener("load", () => {
        updateBackgroundSize();
        updateBackgroundPosition();
      });

      window.addEventListener("resize", () => {
        updateBackgroundSize();
        updateBackgroundPosition();
      });

      glassesContainer.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        isDragging = true;
        glassesContainer.classList.add("dragging");

        const rect = glassesContainer.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        // remove initial centering transform so absolute left/top work
        glassesContainer.style.transform = "none";
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;

        let left = e.clientX - offsetX;
        let top = e.clientY - offsetY;

        // Optional: keep the glasses on-screen
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const rect = glassesContainer.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        left = Math.max(-width * 0.3, Math.min(left, vw - width * 0.7));
        top = Math.max(-height * 0.3, Math.min(top, vh - height * 0.7));

        glassesContainer.style.left = left + "px";
        glassesContainer.style.top = top + "px";

        updateBackgroundPosition();
      });

      const stopDrag = () => {
        if (!isDragging) return;
        isDragging = false;
        glassesContainer.classList.remove("dragging");
      };

      window.addEventListener("pointerup", stopDrag);
      window.addEventListener("pointercancel", stopDrag);
      window.addEventListener("pointerleave", stopDrag);

      // In case the 2D image is already cached
      if (mascot2D.complete) {
        updateBackgroundSize();
        updateBackgroundPosition();
      }
    })();
  </script>
</body>
</html>
