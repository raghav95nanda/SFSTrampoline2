<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Glasses Mascot Reveal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #ffffff;              /* white background */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .ui {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      color: #222;
    }
    .ui .title {
      font-size: 0.95rem;
      opacity: 0.9;
    }
    .ui .hint {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 4px;
    }

    /* 2D mascot in the center, about 100px tall */
    #scene {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 100px;        /* ~100px tall */
      user-select: none;
      pointer-events: none;
    }
    #mascot2D {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Draggable glasses container */
    #glassesContainer {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: min(260px, 80vw);  /* size of glasses */
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      z-index: 10;
    }
    #glassesContainer.dragging {
      cursor: grabbing;
    }

    #glasses {
      width: 100%;
      display: block;
      pointer-events: none;
      position: relative;
      z-index: 3;
    }

    /* Lenses: only these rectangles show the 3D mascot */
    .lens {
      position: absolute;
      overflow: hidden;
      pointer-events: none;
      background-image: url("3D%20Mascot.png");
      background-repeat: no-repeat;
      background-size: cover;  /* will be set to mascot size via JS */
      z-index: 1;
    }

    /* Approximate positions of eye holes in the PNG.
       You can tweak left/top/width/height % values if needed. */
    .lens.left {
      left: 28%;     /* horizontal offset of left eye-hole in frame */
      top: 32%;      /* vertical offset */
      width: 18%;    /* eye-hole width */
      height: 38%;   /* eye-hole height */
    }
    .lens.right {
      right: 28%;
      top: 32%;
      width: 18%;
      height: 38%;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="title">Drag the 3D glasses around</div>
    <div class="hint">When the lenses pass over the mascot, it appears in 3D.</div>
  </div>

  <!-- Centered 2D mascot -->
  <div id="scene">
    <img id="mascot2D" src="2D-Mascot.png" alt="2D Mascot" />
  </div>

  <!-- Draggable glasses + 3D reveal lenses -->
  <div id="glassesContainer">
    <div class="lens left"></div>
    <div class="lens right"></div>
    <img id="glasses" src="3DGlasses.png" alt="3D Glasses" />
  </div>

  <script>
    (function () {
      const scene = document.getElementById("scene");
      const glassesContainer = document.getElementById("glassesContainer");
      const mascot2D = document.getElementById("mascot2D");
      const lenses = Array.from(document.querySelectorAll(".lens"));

      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;

      function updateLensBackgroundSize() {
        const rect = scene.getBoundingClientRect();
        lenses.forEach(lens => {
          lens.style.backgroundSize = rect.width + "px " + rect.height + "px";
        });
      }

      function updateLensBackgroundPosition() {
        const sceneRect = scene.getBoundingClientRect();

        lenses.forEach(lens => {
          const lensRect = lens.getBoundingClientRect();

          // Position of lens relative to mascot
          const relLeft = lensRect.left - sceneRect.left;
          const relTop = lensRect.top - sceneRect.top;

          // Shift background so this lens shows the correct part of the 3D mascot
          lens.style.backgroundPosition = `-${relLeft}px -${relTop}px`;
        });
      }

      function updateAllLens() {
        updateLensBackgroundSize();
        updateLensBackgroundPosition();
      }

      mascot2D.addEventListener("load", updateAllLens);
      window.addEventListener("resize", updateAllLens);

      // Dragging logic for the glasses
      glassesContainer.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        isDragging = true;
        glassesContainer.classList.add("dragging");

        const rect = glassesContainer.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        // Remove initial centering transform so left/top work directly
        glassesContainer.style.transform = "none";
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;

        let left = e.clientX - offsetX;
        let top = e.clientY - offsetY;

        // Keep glasses roughly on-screen
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const rect = glassesContainer.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;

        left = Math.max(-w * 0.3, Math.min(left, vw - w * 0.7));
        top  = Math.max(-h * 0.3, Math.min(top, vh - h * 0.7));

        glassesContainer.style.left = left + "px";
        glassesContainer.style.top  = top + "px";

        updateLensBackgroundPosition();
      });

      function stopDrag() {
        if (!isDragging) return;
        isDragging = false;
        glassesContainer.classList.remove("dragging");
      }

      window.addEventListener("pointerup", stopDrag);
      window.addEventListener("pointercancel", stopDrag);
      window.addEventListener("pointerleave", stopDrag);

      // If the mascot image is already cached and loaded
      if (mascot2D.complete) {
        updateAllLens();
      }
    })();
  </script>
</body>
</html>
