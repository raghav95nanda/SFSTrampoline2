<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Glasses Mascot Reveal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
      overflow: hidden;
    }

    .ui {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .title {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .hint {
      font-size: 0.8rem;
      opacity: 0.7;
      margin-top: 4px;
    }

    /* Tiny mascot in the corner */
    #scene {
      position: fixed;
      bottom: 10px;
      left: 10px;
      height: 100px; /* ~100px tall character */
      user-select: none;
      pointer-events: none;
    }

    #mascot2D {
      height: 100%;
      width: auto;
      display: block;
    }

    /* Draggable glasses window */

    #glassesContainer {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: min(220px, 80vw);   /* small glasses */
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      overflow: hidden;          /* acts as clipping window */
      z-index: 10;

      /* 3D mascot behind the glasses; will be aligned in JS */
      background-image: url("3D%20Mascot.png");
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: cover;
    }

    #glassesContainer.dragging {
      cursor: grabbing;
    }

    #glasses {
      width: 100%;
      display: block;
      pointer-events: none;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="title">Drag the 3D glasses around the screen</div>
    <div class="hint">When they pass over the tiny mascot, it pops into 3D.</div>
  </div>

  <!-- Tiny 2D mascot in the corner -->
  <div id="scene">
    <img id="mascot2D" src="2D-Mascot.png" alt="2D Mascot" />
  </div>

  <!-- Draggable 3D glasses window -->
  <div id="glassesContainer">
    <!-- IMPORTANT: the eye holes of this PNG should be transparent.
         Then only those parts show the 3D mascot background behind it. -->
    <img id="glasses" src="3DGlasses.png" alt="3D Glasses" />
  </div>

  <script>
    (function () {
      const scene = document.getElementById("scene");
      const glassesContainer = document.getElementById("glassesContainer");
      const mascot2D = document.getElementById("mascot2D");

      let isDragging = false;
      let offsetX = 0;
      let offsetY = 0;

      // Make 3D background scale to the same size as the (scaled) 2D mascot
      function updateBackgroundSize() {
        const rect = scene.getBoundingClientRect();
        glassesContainer.style.backgroundSize = rect.width + "px " + rect.height + "px";
      }

      // Align the 3D mascot under the glasses so it matches the 2D mascot below
      function updateBackgroundPosition() {
        const sceneRect = scene.getBoundingClientRect();
        const glassesRect = glassesContainer.getBoundingClientRect();

        const relLeft = glassesRect.left - sceneRect.left;
        const relTop  = glassesRect.top  - sceneRect.top;

        // Negative offset so the part “under” the glasses matches the 2D mascot
        glassesContainer.style.backgroundPosition = `-${relLeft}px -${relTop}px`;
      }

      mascot2D.addEventListener("load", () => {
        updateBackgroundSize();
        updateBackgroundPosition();
      });

      window.addEventListener("resize", () => {
        updateBackgroundSize();
        updateBackgroundPosition();
      });

      glassesContainer.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        isDragging = true;
        glassesContainer.classList.add("dragging");

        const rect = glassesContainer.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        // Remove initial centering transform so left/top work directly
        glassesContainer.style.transform = "none";
      });

      window.addEventListener("pointermove", (e) => {
        if (!isDragging) return;

        let left = e.clientX - offsetX;
        let top  = e.clientY - offsetY;

        // Keep glasses roughly within the viewport
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const rect = glassesContainer.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;

        left = Math.max(-w * 0.3, Math.min(left, vw - w * 0.7));
        top  = Math.max(-h * 0.3, Math.min(top, vh - h * 0.7));

        glassesContainer.style.left = left + "px";
        glassesContainer.style.top  = top + "px";

        updateBackgroundPosition();
      });

      const stopDrag = () => {
        if (!isDragging) return;
        isDragging = false;
        glassesContainer.classList.remove("dragging");
      };

      window.addEventListener("pointerup", stopDrag);
      window.addEventListener("pointercancel", stopDrag);
      window.addEventListener("pointerleave", stopDrag);

      // In case image is cached and already loaded
      if (mascot2D.complete) {
        updateBackgroundSize();
        updateBackgroundPosition();
      }
    })();
  </script>
</body>
</html>
